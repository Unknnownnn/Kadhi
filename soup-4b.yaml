# Kadhi 4B experiment for a 4 GB NVIDIA GPU.
base: Qwen/Qwen3-4B
task: sft

data:
  train: ./data/train.jsonl
  format: alpaca
  val_split: 0.1
  max_length: 128

training:
  epochs: 1
  lr: 2e-5
  batch_size: 1
  gradient_accumulation_steps: 4
  gradient_checkpointing: true
  stream_layers: true
  stream_source: auto
  lora:
    r: 4
    alpha: 8
    target_modules: auto
  quantization: 4bit

output: ./output-4b