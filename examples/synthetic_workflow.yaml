base: TinyLlama/TinyLlama-1.1B-Chat-v1.0
task: sft
modality: text
backend: transformers

data:
  train: ./synth_clean.jsonl
  format: auto
  val_split: 0.05
  max_length: 1024

training:
  epochs: 1
  lr: 2.0e-4
  batch_size: auto
  quantization: 4bit
  optimizer: adamw_torch
  scheduler: cosine
  gradient_checkpointing: true
  warmup_auto: true
  auto_mixed_precision: true
  lora:
    r: 8
    alpha: 16
    dropout: 0.05

output: ./synth_out

eval:
  auto_eval: false
